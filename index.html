  letter:'I think this is enough shenanigans for today. My main point in all of this is simply to express how happy and thankful I am that you’re part of my life.\n\nI know you’re a special person in this world, the kind of person everyone wishes they had the chance to meet. Too bad they’re not as lucky as I am.\n\nI’m also grateful for how you’ve opened my eyes to topics and perspectives I probably would have never explored or even been aware of if I hadn’t met you. You’ve also become one of the reasons I constantly want to be a better person. Although, just so you know, I’m not going to let you get too far ahead of me that easily.\n\nBut there are a few things I need to make sure you know about yourself first.\n\nFor starters, YOU ARE TOO COOL. Seriously, save some for the rest of us.\n\nSecondly, you’re way too smart. Being academically smart is one thing, but in your case, you literally know everything. Politics, economics, psychology, law, geography and the list just keeps going. How is that even fair?\n\nYou’re also the best artisan I’ve ever met. Who even thinks of creating an entire ecosystem out of some ribbons? And then there’s that damn photographic memory of yours. You have no idea how jealous I am of that.\n\nBut jokes aside, my point is that I genuinely appreciate you and everything that makes you YOU.\n\nI know I’m not the best when it comes to expressing myself or putting my emotions into words, but I still wanted to do something special for you on your birthday, something that would hopefully show how much I appreciate having you in my life.\n\nI may have underestimated just how difficult making this website would be, but that wasn’t going to stop me. So I really hope you like it.\n\nAnd once again, thank you for being born.',

 if(a==='n'||a==='b'){ti=(ti+(a==='n'?1:L.length-1))%L.length;if(au){au.pause();au=null}pl=0}
 if(a==='p')pl=!pl;
 const tr=L[ti];
 if(tr.src){if(!au)mkAudio();if(pl){const r=au.play();r&&r.catch&&r.catch(()=>{pl=0;songSync()})}else au.pause()}
 songSync()}
function fortune(){const f=TEXT.p14.fortunes;$('#ft').textContent=f[Math.floor(Math.random()*f.length)]}
/* ===== PAGES ===== each beat = one tap of CONTINUE. t = theme, n = page number shown. */
const P1=TEXT.p1,P3=TEXT.p3,P5=TEXT.p5,P6=TEXT.p6,P8=TEXT.p8,P9=TEXT.p9,P10=TEXT.p10,P11=TEXT.p11,P12=TEXT.p12,P13=TEXT.p13,P14=TEXT.p14;
const PAGES=[
{t:'',n:1,b:[
 `${P1.masthead?M(P1.masthead):''}<div style="margin:18px 0 6px"><button class="stop" style="background:none;box-shadow:none;min-height:0;padding:0" onclick="toast(TEXT.eggs.tulip)" aria-label="Tulip">${T(34)}</button></div><h2 class="big">${N(S.first)}</h2>`,
 P1.lines.map(Q).join(''),
 `<p class="hw">${N(P1.note)}</p>`,
 `<p class="q" style="opacity:.6">${N(P1.onlyChild)}</p>`]},
{t:'cream',n:2,b:[
 {h:`${K(P3.kicker)}${H(P3.title)}<svg viewBox="0 0 200 160" width="100%" style="max-width:300px;margin:10px auto" role="img" aria-label="${E(P3.alt)}"><rect x="10" y="132" width="180" height="3" fill="currentColor" opacity=".2"/><path id="r" d="M30 128C55 90 85 108 100 80" stroke="#6E1F2B" stroke-width="10" stroke-linecap="round" fill="none"/><rect id="pp" x="118" y="52" width="30" height="30" fill="#F6F1E4" stroke="#241F1C" stroke-width="1.5" transform="rotate(12 133 67)"/><g id="fl"><path d="M100 90V130" stroke="#3F5B3F" stroke-width="3"/><circle cx="100" cy="80" r="9" fill="#B08A45"/>${[0,60,120,180,240,300].map(d=>`<ellipse cx="116" cy="80" rx="15" ry="7" fill="#6E1F2B" opacity=".85" transform="rotate(${d} 100 80)"/>`).join('')}</g></svg>`},
 {h:Q(P3.lines[0]),do:()=>add('r')},
 {h:Q(P3.lines[1]),do:()=>{add('pp');document.getElementById('pp').style.transform='translate(-18px,18px) rotate(45deg)'}},
 {h:Q(P3.lines[2]),do:()=>{add('fl');$('#pp').style.opacity=.25}}]},
{t:'dark',n:3,b:[
 {h:`${K(P5.kicker)}${H(P5.title)}<button class="vin" id="vn" onclick="this.classList.toggle('sp2')" aria-label="Vinyl record"><i>${N(P5.artwork)}</i></button><div><h3 id="mt"></h3><p class="q" id="ma"></p></div><div class="bts"><button class="bt" id="pp2" onclick="music('p')">${N(P5.play)}</button></div><div class="bar" id="pb"><i></i></div><p class="m" id="mn"></p>`,do:()=>music()}]},
{t:'',n:4,b:[
 `${K(P6.kicker)}${H(P6.title)}<div class="row"><button onclick="toast(TEXT.eggs.united)">${M(P6.himLabel)}<div style="font-size:1.8rem">🔴</div>${Q(P6.him)}</button><b class="q">${N(P6.vs)}</b><button onclick="toast(TEXT.eggs.spurs)">${M(P6.herLabel)}<div style="font-size:1.8rem">⚪</div>${Q(P6.her)}</button></div>`,
 Q(P6.relations)+`<div class="card">${K(P6.posTitle)}${Q(P6.pos)}</div>`,
 `<div class="card">${K(P6.respTitle)}${Q(P6.resp)}</div>`,
 `<div class="card dk"><h3>${N(P6.derbyTitle)}</h3>${M(P6.derbySub)}<div class="sc"><div>${M(P6.scoreUnited)}<b id="su">0</b></div><span>—</span><div>${M(P6.scoreSpurs)}<b id="ss">0</b></div></div><div class="bts"><button class="bt" onclick="sim()" style="background:var(--bu);border-color:var(--bu);color:var(--iv)">${N(P6.simulate)}</button><button class="bt o" onclick="rst()">${N(P6.reset)}</button></div><p id="sm" class="q" style="color:var(--go);min-height:1.8em;margin-top:14px"></p>${M(P6.disclaimer)}</div>`]},
{t:'',n:5,b:[
 `${K(P8.kicker)}${H(P8.title)}`,
 Q(P8.lines[0]),Q(P8.lines[1]),
 `<div class="paper" style="text-align:left">${K(P8.assignLabel)}${Q(P8.assign)}<p></p>${K(P8.statusLabel)}<p class="m" style="color:var(--bu)">${N(P8.status)}</p></div>`,
 Q(P8.lead),
 `<div class="paper story"><h3>${N(P8.storyTitle)}</h3>${M(P8.storyBy).replace('class="m"','class="m by"')}${P8.story.map(x=>`<p class="t">${E(x).replace(/\*([^*]+)\*/g,'<em>$1</em>')}</p>`).join('')}</div>`]},
{t:'cream',n:6,b:[
 `${K(P9.kicker)}${H(P9.title)}`,
 Q(P9.lines[0]),Q(P9.lines[1]),Q(P9.lines[2]),
 {get h(){return `<button class="stk" onclick="this.classList.toggle('fl2');toast(TEXT.eggs.sticker)" aria-label="${E(P9.alt)}"><img src="img/sticker.jpg" alt="${E(P9.alt)}"></button>${M(P9.caption)}`}},
 `<button class="stk2" onclick="this.classList.toggle('fl2');toast(TEXT.eggs.sticker2)" aria-label="${E(P9.alt2)}"><img src="img/sticker2.webp" alt="${E(P9.alt2)}" loading="lazy"></button>${M(P9.caption2)}`,
 `<div class="card">${K(P9.reportTitle)}<p class="m" style="line-height:2">${N(P9.report)}</p></div><p class="hw" style="font-size:1.6rem">${N(P9.note)}</p>`,
 `<div class="bts">${P9.buttons.map(([a],i)=>`<button class="bt o" onclick="toast(TEXT.p9.buttons[${i}][1])">${N(a)}</button>`).join('')}</div>`]},
{t:'dark',n:7,b:[
 `${K(P10.kicker)}<button class="board" onclick="toast(TEXT.eggs.teacher)"><h3>${N(P10.title)}</h3><ul>${P10.students.map(x=>`<li>${N(x)}</li>`).join('')}</ul></button>`,
 Q(P10.lines[0]),Q(P10.lines[1])]},
{t:'cream',n:8,b:[
 `${K(P11.kicker)}${H(P11.title)}`,
 ...P11.steps.map((x,i)=>`${i?'<p class="m">↓</p>':''}<h3>${N(x)}</h3>`),
 Q(P11.closing),
 `${H(P11.drTitle)}${M(P11.status)}<p class="m" style="color:var(--bu)">${N(P11.progress)}</p><div class="bar" style="background:rgba(36,31,28,.12)"><i style="width:66%;background:var(--bu)"></i></div>`]},
{t:'slow',n:9,b:[
 `${K(P12.kicker)}${H(P12.title)}`,
 `<div class="paper q" style="min-height:180px;text-align:left;font-size:1.25rem;line-height:1.75">${N(P12.letter)}</div>`,
 H(P12.happy),
 Q(P12.signature),
 `<p class="q" style="opacity:.6">${N(P12.ps)}</p>`]},
{t:'dark slow',b:[
 `<div style="font-size:5rem">${T(70)}</div>`,
 `<div>${T(46)} ${T(70)} ${T(46)}</div>`,Q(P13.oh),Q(P13.line),`<div class="fin">${N(P13.emoji)}</div>`]},
{t:'slow',b:[
 {h:H(P14.wait,'margin-top:20vh'),pause:RM?0:2500},
 `<div style="font-size:3.5rem" role="img" aria-label="${E(P14.envelopeAlt)}">✉️</div>`,
 {h:`<div class="paper" style="text-align:center">${M(P14.fortuneLabel)}<p id="ft" class="q" style="margin-top:12px"></p></div>${M(P14.end)}`,btn:P14.button,do:fortune}]}
];
/* ===== engine ===== */
let p=0,s=0;const last=PAGES.length-1;
const bt=i=>{const b=PAGES[p].b[i];return typeof b==='string'?{h:b}:b};
function add1(){s++;const b=bt(s),d=document.createElement('div');d.className='b';d.innerHTML=b.h||'';$('#pg').appendChild(d);b.do&&b.do();
 if(b.pause){$('#go').disabled=true;setTimeout(()=>$('#go').disabled=false,b.pause)}
 d.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'})}
function ui(){const pg=PAGES[p],more=s<pg.b.length-1;
 $('#go').textContent=more?(bt(s+1).btn||U.cont):(p===last?U.again:U.cont);
 $('#pgn').textContent=pg.n?`${U.page} ${String(pg.n).padStart(2,'0')} / ${String(PAGES.filter(x=>x.n).length).padStart(2,'0')}`:'';$('#prog').style.width=((p+1)/PAGES.length*100)+'%';
 $('#bk').style.visibility=p?'visible':'hidden'}
function show(i,full){p=i;s=-1;const pg=PAGES[i];document.body.className=pg.t||'';
 $('#stage').innerHTML=`<div class="pg ${pg.t&&pg.t.includes('slow')?'slow':''}" id="pg"></div>`;
 for(let k=0,n=full?pg.b.length:1;k<n;k++)add1();$('#stage').scrollTop=0;ui();
 songSync()}
function fade(fn){const st=$('#stage');st.style.opacity=0;setTimeout(()=>{fn();st.style.opacity=1},RM?0:350)}
function next(){if(s<PAGES[p].b.length-1){add1();ui()}else if(p<last)fade(()=>show(p+1));else fortune()}
$('#go').onclick=next;$('#bk').onclick=()=>p&&fade(()=>show(p-1,true));
$('#mu').onclick=()=>music('p');$('#tc').innerHTML=T(22);$('#tc').onclick=()=>toast(TEXT.eggs.tulip);$('#tc').style.opacity=.55;
addEventListener('keydown',e=>{if(!$('#intro')&&(e.key==='ArrowRight'||e.key==='Enter'||e.key===' ')&&e.target.tagName!=='BUTTON'){e.preventDefault();next()}if(e.key==='ArrowLeft'&&p)$('#bk').click()});
/* ===== intro ===== */
(async()=>{const L=TEXT.intro,tw=$('#tw'),d=RM?0:1;
 $('#in1').textContent=S.name;$('#in2').textContent=S.title;$('#in3').textContent=S.subtitle;$('#in4').textContent=S.enter;
 for(const l of L){const e=document.createElement('p');tw.appendChild(e);for(const c of l){e.textContent+=c;await w(38*d)}await w(380*d)}
 for(const i of ['in1','in2','in3','in4']){await w(600*d);add(i)}
 $('#in4').onclick=()=>{$('#intro').style.opacity=0;setTimeout(()=>$('#intro').remove(),700);show(0);$('#go').focus()}})();
$('#go').textContent=U.cont;$('#bk').setAttribute('aria-label',U.back);document.title=S.title;ui();
</script>
